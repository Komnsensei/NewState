name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Node tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: SDK containment lint
        run: npm run lint:sdk
      - name: Run test suite
        run: npm test

  python-qih:
    name: QIH python validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy
      - name: Run QIH validation suite
        run: python qih_consciousness/tests/run_all_tests.py
